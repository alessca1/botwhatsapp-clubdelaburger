services:
  - type: web
    name: clubdelaburger-whatsapp
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clubdelaburger-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_ACCOUNT_ID
        sync: false
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: club-2643179759
      - key: BOT_ENABLED
        value: "true"
      - key: HUMAN_PAUSE_MINUTES
        value: "5"
databases:
  - name: clubdelaburger-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: virginia
    ipAllowList: []
